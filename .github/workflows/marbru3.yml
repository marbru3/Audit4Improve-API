name: Flujo marbru3

on:
  issues:
    types: [opened]
  project_card:
    types: [moved]
  workflow_dispatch:

jobs:
 notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificación al log con github-script
        uses: actions/github-script@v6
        with:
          script: |
            const core = require('@actions/core');
            const actor = github.context.actor;
            const repo = github.context.repo.repo;
            const event = github.context.eventName;
            console.log('Hola ${actor}, el flujo ha sido operado por un evento '${event}', en el repositorio ${repo}');

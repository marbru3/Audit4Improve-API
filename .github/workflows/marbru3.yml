name: Flujo marbru3

on:
  issues:
    types: [opened]
  project_card:
    types: [moved]
  workflow_dispatch:

jobs:
 notificacion:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificación al log con github-script
        uses: actions/github-script@v6
        with:
          script: |
            const actor = context.actor;
            const repo = context.repo.repo;
            const event = context.eventName;
            console.log(`Hola ${actor}, el flujo ha sido operado por un evento ${event}, en el repositorio ${repo}`);
